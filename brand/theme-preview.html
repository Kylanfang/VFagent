          <div class="tb-btn"><svg viewBox="0 0 12 12" width="12" height="12"><path d="M2 6h8" stroke="currentColor" stroke-width="1.2" /></svg></div>
          <div class="tb-btn"><svg viewBox="0 0 12 12" width="12" height="12"><rect x="2.5" y="2.5" width="7" height="7" fill="none" stroke="currentColor" stroke-width="1.2" /></svg></div>
          <div class="tb-btn close"><svg viewBox="0 0 12 12" width="12" height="12"><path d="M3 3l6 6M9 3l-6 6" stroke="currentColor" stroke-width="1.2" /></svg></div>
        </div>
      </div>

      <div class="app-body">
        <!-- 左侧导航 -->
        <nav class="rail">
          <div class="logo">
            <svg viewBox="0 0 64 64" width="32" height="32">
              <defs>
                <linearGradient id="pv-rail" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0" stop-color="#0d3a6b" />
                  <stop offset="1" stop-color="#072544" />
                </linearGradient>
              </defs>
              <circle cx="32" cy="32" r="30" fill="url(#pv-rail)" />
              <g fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round">
                <ellipse cx="32" cy="32" rx="24" ry="9.5" transform="rotate(0 32 32)" />
                <ellipse cx="32" cy="32" rx="24" ry="9.5" transform="rotate(60 32 32)" />
                <ellipse cx="32" cy="32" rx="24" ry="9.5" transform="rotate(120 32 32)" />
              </g>
              <circle cx="32" cy="32" r="3" fill="#fff" />
              <circle cx="32" cy="8" r="2.2" fill="#fff" />
              <circle cx="55" cy="45" r="2.2" fill="#fff" />
              <circle cx="9" cy="45" r="2.2" fill="#fff" />
            </svg>
          </div>
          <div class="rail-btn active"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v11H8l-4 4z" /></svg></div>
          <div class="rail-btn"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l9 4v5c0 5-4 8-9 9-5-1-9-4-9-9V7z" /></svg></div>
          <div class="rail-btn"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h4l2-6 3 12 2-6h3" /></svg></div>
          <div class="rail-btn"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8a4 4 0 100 8 4 4 0 000-8zM3 12h2m14 0h2M12 3v2m0 14v2" /></svg></div>
          <div class="rail-spacer"></div>
          <div class="rail-status"><span class="dot ok"></span></div>
        </nav>

        <!-- 会话历史 + 对话区 -->
        <div class="chat-layout" style="flex: 1; min-width: 0">
          <aside class="chat-history">
            <div class="history-new">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14" /></svg>
              新建对话
            </div>
            <div class="history-list">
              <div class="history-item on"><span class="history-title">资金占用与关联交易核查</span></div>
              <div class="history-item"><span class="history-title">采购流程穿行测试底稿</span></div>
              <div class="history-item"><span class="history-title">三张表勾稽关系复核</span></div>
              <div class="history-item"><span class="history-title">供应商集中度分析</span></div>
            </div>
            <div class="history-foot">本地留存 · 4 条会话</div>
          </aside>

          <div class="chat-main">
            <div class="chat-view">
              <div class="chat-scroll">
                <div class="chat-empty">
                  <h1>有什么可以核查的？</h1>
                  <p>接入 20 项 MCP 工具 · 审计风险与合规数据已就绪</p>
                  <div class="prompt-cards">
                    <button>生成本期风险热力图</button>
                    <button>检查三张表勾稽</button>
                    <button>列出高风险告警</button>
                    <button>导出底稿索引</button>
                  </div>
                </div>
              </div>
              <div class="composer-wrap">
                <div class="composer">
                  <div class="model-picker">
                    <div class="model-pill">
                      <span class="model-pill-name">MiniMax-M3</span>
                      <span class="chev">▾</span>
                    </div>
                  </div>
                  <textarea rows="1" placeholder="询问审计、风控或数据核查事项…"></textarea>
                  <button class="send">↑</button>
                </div>
                <div class="composer-meta">
                  <span>MCP 已连接 6 / 6</span>
                  <span>·</span>
                  <span>Enter 发送，Shift+Enter 换行</span>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
